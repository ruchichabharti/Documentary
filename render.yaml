services:
  # ─── 1. Backend Web Service (Node.js API + WebSocket) ────────────────────────
  - type: web
    name: docmind-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: ./collab.db
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

  # ─── 2. Frontend Static Site (Vite React) ────────────────────────────────────
  - type: web
    name: docmind-web
    runtime: static
    plan: free
    region: oregon
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: docmind-api
          property: host
      - key: VITE_WS_URL
        fromService:
          type: web
          name: docmind-api
          property: host
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_GEMINI_API_KEY
        sync: false
